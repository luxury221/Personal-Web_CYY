  <text x="54" y="101" fill="#243034" font-family="serif" font-size="30">Kongming — Structured Multi-Agent Workflow</text>
  <text x="54" y="128" fill="#6f746f" font-family="sans-serif" font-size="14">Roles share AgentContext / AgentEvent / AgentArtifact instead of relying on unconstrained agent-to-agent chat.</text>


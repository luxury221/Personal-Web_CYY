    <rect x="494" y="386" width="184" height="118" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/>
    <text x="512" y="414" fill="#243034">THEIA</text><text x="512" y="438" fill="#6f746f">workspace</text><text x="512" y="462" fill="#243034">JUDGE0</text><text x="512" y="484" fill="#6f746f">isolated execution</text>

    <rect x="702" y="386" width="184" height="118" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/>
    <text x="720" y="414" fill="#243034">API / AUTH</text><text x="720" y="438" fill="#6f746f">separate services</text><text x="720" y="462" fill="#243034">ASSISTANT</text><text x="720" y="484" fill="#6f746f">teaching service</text>

    <rect x="910" y="386" width="200" height="118" rx="5" fill="#21484c" fill-opacity=".07" stroke="#21484c" stroke-opacity=".55"/>
    <text x="928" y="414" fill="#243034">PRIVATE DEPLOY</text><text x="928" y="438" fill="#6f746f">single-host / split</text><text x="928" y="462" fill="#243034">DOCKER COMPOSE</text><text x="928" y="484" fill="#6f746f">service boundaries</text>
  </g>

  <line x1="54" y1="584" x2="1134" y2="584" stroke="#8f846f" stroke-opacity=".3"/>
  <text x="54" y="614" fill="#6f746f" font-family="monospace" font-size="11">CONTROL PRINCIPLE / AI suggests · teacher decides · every stage remains auditable</text>
  <text x="54" y="640" fill="#8c7153" font-family="monospace" font-size="10">SOURCE / pythc/ai-homework-system · README.md · deployment and grading workflow</text>

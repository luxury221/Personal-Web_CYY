  <g fill="#6f746f" font-family="monospace" font-size="10"><text x="778" y="262">text_ref_figure</text><text x="771" y="383">same_section</text><text x="950" y="277">figure_caption</text><text x="958" y="406">bridge</text></g>

  <rect x="632" y="448" width="478" height="46" rx="5" fill="#faf7f1" stroke="#21484c" stroke-opacity=".25"/>
  <text x="648" y="467" fill="#8c7153" font-family="monospace" font-size="10">WHY THIS MATTERS</text><text x="648" y="486" fill="#243034" font-family="sans-serif" font-size="12">Retrieval can reason over document identity and relations instead of anonymous chunks.</text>

  <line x1="54" y1="570" x2="1134" y2="570" stroke="#8f846f" stroke-opacity=".3"/>
  <text x="54" y="604" fill="#6f746f" font-family="monospace" font-size="11">NODE TYPES / title · text · table · figure · caption · equation · page</text>
  <text x="54" y="632" fill="#8c7153" font-family="monospace" font-size="10">SOURCE / MultiRank-RAG · docs/ARCHITECTURE.md · evidence node layer / document graph</text>

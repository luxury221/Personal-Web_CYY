    <g><circle cx="716" cy="304" r="48" fill="#faf7f1" stroke="#21484c" stroke-opacity=".55"/><text x="716" y="300" fill="#243034" font-size="13">TEXT</text><text x="716" y="318" fill="#6f746f" font-size="10">P11 / ¶3</text></g>
    <g><circle cx="900" cy="300" r="48" fill="#faf7f1" stroke="#21484c" stroke-opacity=".55"/><text x="900" y="296" fill="#243034" font-size="13">FIGURE</text><text x="900" y="314" fill="#6f746f" font-size="10">P12 / F4</text></g>
    <g><circle cx="904" cy="394" r="48" fill="#faf7f1" stroke="#21484c" stroke-opacity=".55"/><text x="904" y="390" fill="#243034" font-size="13">CAPTION</text><text x="904" y="408" fill="#6f746f" font-size="10">P12 / C4</text></g>
    <g><circle cx="1044" cy="342" r="54" fill="#21484c" fill-opacity=".11" stroke="#21484c" stroke-opacity=".7"/><text x="1044" y="338" fill="#243034" font-size="13">EVIDENCE</text><text x="1044" y="356" fill="#6f746f" font-size="10">CHAIN</text></g>

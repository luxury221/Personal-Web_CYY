  <text x="54" y="602" fill="#6f746f" font-family="monospace" font-size="12">UNIFIED INTERFACE / evidence node → retrieval → graph propagation → rerank → evidence chain</text>
  <text x="54" y="632" fill="#8c7153" font-family="monospace" font-size="11">SOURCE / MULTIRANK-RAG · docs/ARCHITECTURE.md</text>

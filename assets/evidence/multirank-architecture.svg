    <g transform="translate(260 414)"><rect width="96" height="72" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/><text x="15" y="27">G0</text><text x="15" y="49" fill="#6f746f">RAW</text></g>
    <g transform="translate(376 414)"><rect width="96" height="72" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/><text x="15" y="27">G1</text><text x="15" y="49" fill="#6f746f">SEMANTIC</text></g>
    <g transform="translate(492 414)"><rect width="96" height="72" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/><text x="15" y="27">G2</text><text x="15" y="49" fill="#6f746f">+ PPR</text></g>
    <g transform="translate(608 414)"><rect width="96" height="72" rx="5" fill="#f1ece3" stroke="#21484c" stroke-opacity=".35"/><text x="15" y="27">G3</text><text x="15" y="49" fill="#6f746f">+ BRIDGE</text></g>
    <g transform="translate(724 414)"><rect width="126" height="72" rx="5" fill="#21484c" fill-opacity=".09" stroke="#21484c" stroke-opacity=".65"/><text x="15" y="27">G4</text><text x="15" y="49" fill="#6f746f">VIS + CHAIN</text></g>
  </g>
  <g stroke="#21484c" stroke-width="1" marker-end="url(#arrow)"><path d="M356 450H368"/><path d="M472 450H484"/><path d="M588 450H600"/><path d="M704 450H716"/></g>

  <rect x="920" y="358" width="214" height="168" rx="8" fill="#21484c" fill-opacity=".09" stroke="#21484c" stroke-opacity=".68"/>
  <text x="940" y="390" fill="#8c7153" font-family="monospace" font-size="13">EVIDENCE CHAIN</text>
  <text x="940" y="424" fill="#243034" font-family="serif" font-size="20">VERIFY BEFORE ANSWER</text>
  <text x="940" y="452" fill="#6f746f" font-family="sans-serif" font-size="13">primary node</text>
  <text x="940" y="474" fill="#6f746f" font-family="sans-serif" font-size="13">same-page / section context</text>
  <text x="940" y="496" fill="#6f746f" font-family="sans-serif" font-size="13">figure / caption / graph relations</text>

  <g stroke="#21484c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M1027 298V346"/><path d="M870 442H912"/></g>

    <rect x="240" y="168" width="178" height="130" rx="6" fill="#faf7f1" stroke="#21484c" stroke-opacity=".45"/>
    <text x="258" y="198" fill="#8c7153">EVIDENCE NODE</text><text x="258" y="224">TEXT · TABLE</text><text x="258" y="246">FIGURE · CAPTION</text><text x="258" y="268">EQUATION · PAGE</text><text x="258" y="288" fill="#6f746f">page / bbox / section</text>

    <rect x="468" y="168" width="176" height="130" rx="6" fill="#faf7f1" stroke="#21484c" stroke-opacity=".45"/>
    <text x="486" y="198" fill="#8c7153">VISUAL LAYER</text><text x="486" y="224">OCR TEXT</text><text x="486" y="246">CAPTION</text><text x="486" y="268">QA EVIDENCE</text><text x="486" y="288" fill="#6f746f">visual grounding</text>

    <rect x="694" y="168" width="176" height="130" rx="6" fill="#faf7f1" stroke="#21484c" stroke-opacity=".45"/>
    <text x="712" y="198" fill="#8c7153">GRAPHRAG</text><text x="712" y="224">STRUCTURE</text><text x="712" y="246">REFERENCE</text><text x="712" y="268">ENTITY / COMMUNITY</text><text x="712" y="288" fill="#6f746f">bridge evidence</text>

    <rect x="920" y="168" width="214" height="130" rx="6" fill="#21484c" fill-opacity=".075" stroke="#21484c" stroke-opacity=".65"/>
    <text x="938" y="198" fill="#8c7153">RETRIEVAL</text><text x="938" y="224">BM25 · EMBEDDING</text><text x="938" y="246">VISUAL · TABLE</text><text x="938" y="268">KG / GRAPHRAG</text><text x="938" y="288" fill="#6f746f">coverage first</text>
  </g>


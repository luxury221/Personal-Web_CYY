<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MultiRank-RAG architecture</title>
  <desc id="desc">Complex PDF to evidence nodes, visual enrichment, GraphRAG, hybrid retrieval, MultiRank reranking and evidence-chain verification.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21484c" stroke-opacity=".055"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#21484c"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f1ece3"/>
  <rect x="18" y="18" width="1164" height="644" rx="8" fill="url(#grid)" stroke="#8f846f" stroke-opacity=".42"/>
  <text x="54" y="62" fill="#8c7153" font-family="monospace" font-size="14" letter-spacing="2">EVIDENCE / 01 · ARCHITECTURE</text>
  <text x="54" y="101" fill="#243034" font-family="serif" font-size="30">MultiRank-RAG — Evidence Flow</text>
  <text x="54" y="128" fill="#6f746f" font-family="sans-serif" font-size="14">Complex PDF → structured evidence → graph-aware retrieval → reranking → verifiable chain</text>

  <g font-family="monospace" font-size="13" fill="#243034">
    <rect x="54" y="188" width="136" height="90" rx="6" fill="#faf7f1" stroke="#21484c" stroke-opacity=".45"/>

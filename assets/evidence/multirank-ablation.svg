  <text x="798" y="411" fill="#243034" font-family="monospace" font-size="28">.662 → <tspan fill="#21484c">.730</tspan></text>
  <line x1="798" y1="437" x2="1110" y2="437" stroke="#8f846f" stroke-opacity=".3"/>
  <text x="798" y="472" fill="#6f746f" font-family="sans-serif" font-size="13">Negative control</text>
  <text x="798" y="497" fill="#243034" font-family="sans-serif" font-size="13">RAGBench eManual stays saturated;</text><text x="798" y="517" fill="#243034" font-family="sans-serif" font-size="13">enhancements do not improve the simple-text case.</text>

  <line x1="54" y1="590" x2="1134" y2="590" stroke="#8f846f" stroke-opacity=".3"/>
  <text x="54" y="620" fill="#6f746f" font-family="monospace" font-size="11">SOURCE / MultiRank-RAG · docs/PUBLIC_BENCHMARK_RESULTS.md · run public_bm25_v0v5_full_20260520</text>
  <text x="54" y="642" fill="#8c7153" font-family="monospace" font-size="10">Interpretation: V5 helps structured / multi-hop evidence ranking; MMLongBench-Doc remains first-stage retrieval limited.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MultiRank-RAG public benchmark ablation</title>
  <desc id="desc">FinQA nDCG at 5 improves from 0.678 in V0 to 0.878 in V5 under a fixed BM25 candidate set. MultiHop evidence chain score improves from 0.864 in V4 to 0.890 in V5 and gold node coverage from 0.662 to 0.730.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21484c" stroke-opacity=".05"/></pattern></defs>
  <rect width="1200" height="680" fill="#f1ece3"/><rect x="18" y="18" width="1164" height="644" rx="8" fill="url(#grid)" stroke="#8f846f" stroke-opacity=".42"/>
  <text x="54" y="62" fill="#8c7153" font-family="monospace" font-size="14" letter-spacing="2">EVIDENCE / 02 · CONTROLLED ABLATION</text>
  <text x="54" y="101" fill="#243034" font-family="serif" font-size="30">Public Benchmark — V0 → V5</text>
  <text x="54" y="128" fill="#6f746f" font-family="sans-serif" font-size="14">Retriever fixed to BM25 · candidate / rerank k = 50 / 10 · answer generation disabled</text>

  <rect x="54" y="168" width="684" height="386" rx="8" fill="#faf7f1" stroke="#21484c" stroke-opacity=".38"/>
  <text x="78" y="201" fill="#8c7153" font-family="monospace" font-size="12">T2 / FINQA · nDCG@5</text>
  <text x="78" y="232" fill="#243034" font-family="serif" font-size="22">Evidence ordering improves under the same candidate set.</text>
  <g font-family="monospace" font-size="11" fill="#6f746f"><text x="84" y="500">V0</text><text x="186" y="500">V1</text><text x="288" y="500">V2</text><text x="390" y="500">V3</text><text x="492" y="500">V4</text><text x="594" y="500">V5</text></g>
  <g stroke="#8f846f" stroke-opacity=".22"><line x1="88" y1="456" x2="690" y2="456"/><line x1="88" y1="406" x2="690" y2="406"/><line x1="88" y1="356" x2="690" y2="356"/><line x1="88" y1="306" x2="690" y2="306"/></g>
  <g fill="#21484c" fill-opacity=".28" stroke="#21484c" stroke-opacity=".55">
    <rect x="82" y="388" width="54" height="86" rx="3"/><rect x="184" y="388" width="54" height="86" rx="3"/><rect x="286" y="385" width="54" height="89" rx="3"/><rect x="388" y="385" width="54" height="89" rx="3"/><rect x="490" y="379" width="54" height="95" rx="3"/><rect x="592" y="288" width="54" height="186" rx="3" fill-opacity=".48"/>
  </g>
  <g fill="#243034" font-family="monospace" font-size="12"><text x="88" y="378">.678</text><text x="190" y="378">.678</text><text x="292" y="375">.683</text><text x="394" y="375">.683</text><text x="496" y="369">.695</text><text x="598" y="278" fill="#21484c" font-size="14">.878</text></g>
  <path d="M109 388L211 388L313 385L415 385L517 379L619 288" fill="none" stroke="#21484c" stroke-width="2.4"/>
  <g fill="#21484c"><circle cx="109" cy="388" r="4"/><circle cx="211" cy="388" r="4"/><circle cx="313" cy="385" r="4"/><circle cx="415" cy="385" r="4"/><circle cx="517" cy="379" r="4"/><circle cx="619" cy="288" r="5"/></g>
  <rect x="78" y="516" width="624" height="24" rx="4" fill="#21484c" fill-opacity=".065"/><text x="90" y="533" fill="#21484c" font-family="monospace" font-size="11">Δ V0→V5 = +0.200 absolute · structured/table-aware reranking changes ordering, not candidate recall</text>

  <rect x="774" y="168" width="360" height="386" rx="8" fill="#faf7f1" stroke="#21484c" stroke-opacity=".38"/>
  <text x="798" y="201" fill="#8c7153" font-family="monospace" font-size="12">MULTIHOP-RAG · EVIDENCE CHAIN</text>
  <text x="798" y="235" fill="#243034" font-family="serif" font-size="21">V4 → V5</text>
  <text x="798" y="268" fill="#6f746f" font-family="sans-serif" font-size="13">Chain score</text>
  <text x="798" y="309" fill="#243034" font-family="monospace" font-size="28">.864 → <tspan fill="#21484c">.890</tspan></text>
  <line x1="798" y1="335" x2="1110" y2="335" stroke="#8f846f" stroke-opacity=".3"/>

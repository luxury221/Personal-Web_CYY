name: Portfolio QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            script-core.js
            script.js
            tools/runtime-smoke.mjs
          )
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Check architecture contract
        shell: bash
        run: |
          set -euo pipefail
          test -f styles-ai.css
          test -f robots.txt
          test -f assets/og-card.jpg
          test -f sitemap.xml
          # merged layer file must carry every layer banner, in order
          for marker in "LAYER: content-v3-fixes" "LAYER: cyy-ai-v2.js" "LAYER: evidence-v4" "LAYER: showcase-v5.js" "LAYER: final-v6.js" "LAYER: pet.js" "LAYER: research-assistant.js"; do
            grep -q "$marker" script.js
          done
          # the consolidated file must not LOAD the deleted layer scripts
          # (quoted filenames = loader entries; LAYER banners are comments)
          if grep -qE "['\"](content-v3-fixes|cyy-ai-v2|evidence-v4|showcase-v5|showcase-v5-guard|final-v6)\.js" script.js; then
            echo "script.js still references deleted layer files"; exit 1
          fi
          grep -q "0.678 → 0.878" README.md
          grep -q "retriever fixed.*BM25\|fixed \*\*BM25\*\*" README.md

      - name: Validate CYY mascot WebP integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          names = ('idle.webp', 'wave.webp', 'thinking.webp', 'point.webp', 'read.webp', 'sleep.webp')
          root = Path('assets/cys-pet')

          for name in names:
              path = root / name
              data = path.read_bytes()
              if len(data) < 12:
                  raise SystemExit(f'{path}: too short to be a WebP file ({len(data)} bytes)')
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{path}: invalid RIFF/WEBP signature')

              declared = struct.unpack('<I', data[4:8])[0] + 8
              if declared != len(data):
                  raise SystemExit(
                      f'{path}: truncated/corrupt WebP — RIFF declares {declared} bytes, actual {len(data)} bytes'
                  )

              print(f'OK {path}: {len(data)} bytes')
          PY

      - name: Smoke-test static pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cyy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done

          pages=(index.html profile.html experience.html education.html focus.html contact.html)
          assets=(styles.css styles-ai.css script-core.js script.js)

          for path in "${pages[@]}" "${assets[@]}"; do
            echo "GET /$path"
            curl -fsS "http://127.0.0.1:8000/$path" >/dev/null
          done

      - name: Runtime smoke test (Chromium)
        timeout-minutes: 8
        shell: bash
        run: |
          cd tools
          npm ci --silent
          npx playwright-core install --with-deps chromium
          cd ..
          node tools/runtime-smoke.mjs
